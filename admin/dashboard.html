<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Advancer POW</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080B10;--surface:#0F1318;--card:#131820;--border:#1E2530;--accent:#7B61FF;--accent2:#00E5C3;--text:#E8EDF2;--muted:#5A6470;--dim:#8A94A0}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:'Space Grotesk',sans-serif}
input,select,textarea{font-family:'Space Grotesk',sans-serif}

.nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:52px;gap:12px}
.nav-brand{font-family:'Space Mono',monospace;font-size:12px;color:var(--accent2);letter-spacing:.1em}
.nav-links{display:flex;gap:8px}
.nav-btn{background:none;border:1px solid var(--border);border-radius:7px;padding:5px 12px;color:var(--dim);font-size:12px;font-family:'Space Mono',monospace}
.nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.nav-btn.danger{border-color:rgba(255,77,77,.3);color:#ff4d4d}
.saved-msg{font-family:'Space Mono',monospace;font-size:11px;color:var(--accent2);display:none}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-top:24px;overflow-x:auto}
.tab{padding:11px 18px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.panel{display:none;padding:24px 0}
.panel.active{display:block}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.panel-title{font-size:15px;font-weight:600}
.btn-add{background:var(--accent);border:none;border-radius:7px;padding:8px 16px;color:#fff;font-size:12px;font-weight:600}
.btn-save-order{background:rgba(0,229,195,.12);border:1px solid rgba(0,229,195,.35);border-radius:7px;padding:8px 14px;color:var(--accent2);font-size:12px;font-weight:600;display:none}
.btn-save-order:hover{background:rgba(0,229,195,.2)}

.form-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
.form-title{font-size:13px;font-weight:600;margin-bottom:16px;color:var(--accent2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
.field label{font-size:10px;color:var(--dim);font-family:'Space Mono',monospace;display:block;margin-bottom:3px;letter-spacing:.04em}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 11px;color:var(--text);font-size:13px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:70px;resize:vertical}
.field-full{grid-column:1/-1}
.img-preview{width:100%;max-height:120px;object-fit:cover;border-radius:7px;margin-bottom:6px;border:1px solid var(--border);display:none}
.img-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.img-row{grid-template-columns:1fr}}
.form-btns{display:flex;gap:8px;margin-top:16px;align-items:center}
.btn-save{flex:1;background:var(--accent);border:none;border-radius:7px;padding:10px;color:#fff;font-size:13px;font-weight:600;position:relative}
.btn-save.loading{opacity:.7;pointer-events:none}
.btn-save .spinner{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
.btn-save.loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-cancel{flex:1;background:none;border:1px solid var(--border);border-radius:7px;padding:10px;color:var(--muted);font-size:13px}
.btn-cancel:hover{border-color:var(--accent);color:var(--accent)}
.save-feedback{font-size:12px;color:var(--accent2);margin-top:8px;display:none;font-family:'Space Mono',monospace}

.post-form{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.post-form-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.post-form-label{font-family:'Space Mono',monospace;font-size:10px;color:var(--accent)}
.btn-remove-post{background:none;border:none;color:var(--muted);font-size:12px;padding:0}
.btn-remove-post:hover{color:#ff4d4d}
.btn-add-update{width:100%;background:none;border:1px dashed var(--border);border-radius:7px;padding:9px;color:var(--muted);font-size:12px;margin-bottom:12px}
.btn-add-update:hover{border-color:var(--accent);color:var(--accent)}

.item-row{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:border-color .15s}
.item-row:hover{border-color:rgba(123,97,255,.35)}
.item-thumb{width:52px;height:36px;object-fit:cover;border-radius:5px;flex-shrink:0;background:var(--surface)}
.item-info{flex:1;min-width:0}
.item-title{font-size:13px;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-meta{font-size:10px;color:var(--muted);font-family:'Space Mono',monospace}
.item-actions{display:flex;gap:6px;flex-shrink:0}
.btn-edit,.btn-del,.btn-order{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:11px;color:var(--dim)}
.btn-edit:hover{border-color:var(--accent);color:var(--accent)}
.btn-del{border-color:rgba(255,77,77,.3);color:#ff4d4d}
.btn-order{padding:5px 8px;font-size:13px;line-height:1}
.btn-order:hover{border-color:var(--accent);color:var(--accent)}
.empty-msg{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);padding:20px 0}
.loading-msg{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.status-group{display:flex;gap:6px;flex-wrap:wrap}
.status-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 12px;color:var(--muted);font-size:11px;font-family:'Space Mono',monospace}
.status-btn.active-open{background:rgba(0,229,195,.1);color:#00e5a0;border-color:rgba(0,229,195,.3)}
.status-btn.active-win{background:rgba(0,229,195,.1);color:var(--accent2);border-color:rgba(0,229,195,.3)}
.status-btn.active-loss{background:rgba(255,77,77,.1);color:#ff4d4d;border-color:rgba(255,77,77,.3)}

.review-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.review-name{font-size:13px;font-weight:600;margin-bottom:4px}
.review-date{font-size:10px;color:var(--muted);font-family:'Space Mono',monospace;margin-bottom:8px}
.review-text{font-size:13px;color:var(--dim);line-height:1.5}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <span class="nav-brand">POW · ADMIN</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="saved-msg" id="saved-msg">✓ Saved</span>
      <div class="nav-links">
        <button class="nav-btn" onclick="location.href='../'">← View Site</button>
        <button class="nav-btn danger" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('articles')">✍️ Articles (<span id="art-count">0</span>)</button>
    <button class="tab" onclick="switchTab('trades')">📊 Trades (<span id="trade-count">0</span>)</button>
    <button class="tab" onclick="switchTab('reviews')">💬 Reviews (<span id="rev-count">0</span>)</button>
  </div>

  <!-- ARTICLES -->
  <div class="panel active" id="panel-articles">
    <div class="panel-header">
      <h2 class="panel-title">Writing Pieces</h2>
      <div style="display:flex;gap:8px">
        <button class="btn-save-order" id="save-order-articles" onclick="saveArticleOrder()">Save Order</button>
        <button class="btn-add" onclick="openArticleForm()">+ Add Article</button>
      </div>
    </div>
    <div id="article-form-wrap"></div>
    <div id="article-list"><p class="loading-msg">Loading...</p></div>
  </div>

  <!-- TRADES -->
  <div class="panel" id="panel-trades">
    <div class="panel-header">
      <h2 class="panel-title">Trade Records</h2>
      <div style="display:flex;gap:8px">
        <button class="btn-save-order" id="save-order-trades" onclick="saveTradeOrder()">Save Order</button>
        <button class="btn-add" onclick="openTradeForm()">+ Add Trade</button>
      </div>
    </div>
    <div id="trade-form-wrap"></div>
    <div id="trade-list"><p class="loading-msg">Loading...</p></div>
  </div>

  <!-- REVIEWS -->
  <div class="panel" id="panel-reviews">
    <div class="panel-header">
      <h2 class="panel-title">Submitted Reviews</h2>
    </div>
    <div id="review-list"><p class="loading-msg">Loading...</p></div>
  </div>
</div>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let articles = [];
let trades = [];
let reviews = [];
let editingArticleId = null;
let editingTradeId = null;
let tradePostForms = [];
let currentTradeStatus = "open";
let articlesOrderDirty = false;
let tradesOrderDirty = false;

async function checkAuth() {
  const { data } = await sb.auth.getSession();
  if (!data.session) location.href = "index.html";
}
async function logout() {
  await sb.auth.signOut();
  location.href = "index.html";
}

function switchTab(tab) {
  document.querySelectorAll(".tab").forEach((t, i) => {
    const map = ["articles","trades","reviews"];
    t.classList.toggle("active", map[i] === tab);
  });
  document.getElementById("panel-articles").classList.toggle("active", tab === "articles");
  document.getElementById("panel-trades").classList.toggle("active", tab === "trades");
  document.getElementById("panel-reviews").classList.toggle("active", tab === "reviews");
}

function flash() {
  const el = document.getElementById("saved-msg");
  el.style.display = "inline";
  setTimeout(() => el.style.display = "none", 2000);
}

async function loadArticles() {
  const { data } = await sb.from("articles").select("*").order("position", { ascending: true });
  articles = data || [];
  document.getElementById("art-count").textContent = articles.length;
  renderArticleList();
}
async function loadTrades() {
  const { data } = await sb.from("trades").select("*, trade_updates(*)").order("position", { ascending: true });
  trades = data || [];
  document.getElementById("trade-count").textContent = trades.length;
  renderTradeList();
}
async function loadReviews() {
  const { data } = await sb.from("reviews").select("*").order("created_at", { ascending: false });
  reviews = data || [];
  document.getElementById("rev-count").textContent = reviews.length;
  renderReviewList();
}

async function uploadImage(file, bucket) {
  const ext = file.name.split(".").pop();
  const path = `${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
  const { error } = await sb.storage.from(bucket).upload(path, file);
  if (error) throw error;
  const { data } = sb.storage.from(bucket).getPublicUrl(path);
  return data.publicUrl;
}

function previewImg(input, previewId) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const el = document.getElementById(previewId);
    if (el) { el.src = e.target.result; el.style.display = "block"; }
  };
  reader.readAsDataURL(file);
}

// ─── ARTICLES ─────────────────────────────────────────────────────────────────
function openArticleForm(id) {
  editingArticleId = id || null;
  const a = id ? articles.find(x => x.id === id) : null;
  document.getElementById("article-form-wrap").innerHTML = `
    <div class="form-box">
      <p class="form-title">${a ? "Edit Article" : "New Article"}</p>
      <div class="form-grid">
        <div class="field field-full">
          <label>THUMBNAIL</label>
          <img id="a-img-preview" class="img-preview" src="${a?.thumbnail || ""}" style="${a?.thumbnail ? "display:block" : ""}">
          <input type="file" accept="image/*" onchange="previewImg(this,'a-img-preview')" style="font-size:12px;color:var(--dim);width:100%">
        </div>
        <div class="field field-full"><label>TITLE</label><input id="a-title" value="${a?.title || ""}" placeholder="Article title..."></div>
        <div class="field"><label>TAG</label><input id="a-tag" value="${a?.tag || ""}" placeholder="Medium · KiiChain"></div>
        <div class="field"><label>DATE</label><input id="a-date" value="${a?.published_at ? a.published_at.split('T')[0] : ""}" type="date"></div>
        <div class="field field-full"><label>ARTICLE URL</label><input id="a-url" value="${a?.article_url || ""}" placeholder="https://..."></div>
        <div class="field field-full"><label>SUMMARY (optional)</label><textarea id="a-summary" placeholder="Brief description...">${a?.summary || ""}</textarea></div>
      </div>
      <div class="form-btns">
        <button class="btn-save" id="btn-save-article" onclick="saveArticle()"><span class="spinner"></span>Save Article</button>
        <button class="btn-cancel" onclick="closeArticleForm()">Cancel</button>
      </div>
      <p class="save-feedback" id="article-feedback">✓ Saved successfully</p>
    </div>
  `;
  if (a?.thumbnail) document.getElementById("a-img-preview").dataset.existing = a.thumbnail;
}

function closeArticleForm() {
  document.getElementById("article-form-wrap").innerHTML = "";
  editingArticleId = null;
}

async function saveArticle() {
  const btn = document.getElementById("btn-save-article");
  const feedback = document.getElementById("article-feedback");
  btn.classList.add("loading");
  feedback.style.display = "none";

  const fileInput = document.querySelector('#article-form-wrap input[type="file"]');
  const previewEl = document.getElementById("a-img-preview");
  let thumbnail = previewEl?.dataset.existing || null;

  if (fileInput?.files[0]) {
    try { thumbnail = await uploadImage(fileInput.files[0], "thumbnails"); }
    catch(e) { alert("Image upload failed: " + e.message); btn.classList.remove("loading"); return; }
  }

  const payload = {
    title: document.getElementById("a-title").value,
    tag: document.getElementById("a-tag").value,
    article_url: document.getElementById("a-url").value,
    summary: document.getElementById("a-summary").value,
    thumbnail,
    published_at: document.getElementById("a-date").value || new Date().toISOString(),
    updated_at: new Date().toISOString(),
  };

  try {
    if (editingArticleId) {
      await sb.from("articles").update(payload).eq("id", editingArticleId);
    } else {
      const maxPos = articles.reduce((m, a) => Math.max(m, a.position || 0), 0);
      payload.position = maxPos + 1;
      await sb.from("articles").insert(payload);
    }
    feedback.style.display = "block";
    flash();
    setTimeout(() => { closeArticleForm(); loadArticles(); }, 800);
  } catch(e) {
    alert("Save failed: " + e.message);
  }
  btn.classList.remove("loading");
}

async function deleteArticle(id) {
  if (!confirm("Delete this article?")) return;
  await sb.from("articles").delete().eq("id", id);
  await loadArticles();
}

function renderArticleList() {
  const list = document.getElementById("article-list");
  if (!articles.length) { list.innerHTML = '<p class="empty-msg">No articles yet.</p>'; return; }
  list.innerHTML = articles.map(a => `
    <div class="item-row">
      ${a.thumbnail ? `<img class="item-thumb" src="${a.thumbnail}" alt="">` : `<div class="item-thumb"></div>`}
      <div class="item-info">
        <p class="item-title">${a.title}</p>
        <p class="item-meta">${a.tag || ""} · ${formatDate(a.published_at)}</p>
      </div>
      <div class="item-actions">
        <button class="btn-order" onclick="moveArticle('${a.id}',-1)">↑</button>
        <button class="btn-order" onclick="moveArticle('${a.id}',1)">↓</button>
        <button class="btn-edit" onclick="openArticleForm('${a.id}')">Edit</button>
        <button class="btn-del" onclick="deleteArticle('${a.id}')">Del</button>
      </div>
    </div>
  `).join("");
}

function moveArticle(id, dir) {
  const idx = articles.findIndex(a => a.id === id);
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= articles.length) return;
  [articles[idx], articles[swapIdx]] = [articles[swapIdx], articles[idx]];
  renderArticleList();
  articlesOrderDirty = true;
  document.getElementById("save-order-articles").style.display = "inline-block";
}

async function saveArticleOrder() {
  const btn = document.getElementById("save-order-articles");
  btn.textContent = "Saving...";
  btn.disabled = true;
  for (let i = 0; i < articles.length; i++) {
    await sb.from("articles").update({ position: i + 1 }).eq("id", articles[i].id);
  }
  articlesOrderDirty = false;
  btn.textContent = "Save Order";
  btn.style.display = "none";
  btn.disabled = false;
  flash();
}

// ─── TRADES ───────────────────────────────────────────────────────────────────
function openTradeForm(id) {
  editingTradeId = id || null;
  const t = id ? trades.find(x => x.id === id) : null;
  currentTradeStatus = t?.status || "open";
  tradePostForms = t?.trade_updates
    ? t.trade_updates.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(u => ({
        id: u.id, label: u.label, caption: u.caption, x_post: u.x_post,
        existingImg: u.chart_image, existingImg2: u.chart_image_2
      }))
    : [];
  renderTradeFormHTML(t);
}

function renderTradeFormHTML(t) {
  document.getElementById("trade-form-wrap").innerHTML = `
    <div class="form-box">
      <p class="form-title">${t ? "Edit Trade" : "New Trade"}</p>
      <div class="form-grid">
        <div class="field"><label>TICKER</label><input id="tf-ticker" value="${t?.ticker || ""}" placeholder="XMR"></div>
        <div class="field"><label>TIMEFRAME</label><input id="tf-tf" value="${t?.timeframe || ""}" placeholder="4H"></div>
        <div class="field"><label>EXCHANGE</label><input id="tf-ex" value="${t?.exchange || "Bybit"}" placeholder="Bybit"></div>
        <div class="field"><label>TYPE</label>
          <select id="tf-type">
            <option value="Futures" ${t?.trade_type==="Futures"?"selected":""}>Futures</option>
            <option value="Spot" ${t?.trade_type==="Spot"?"selected":""}>Spot</option>
          </select>
        </div>
        <div class="field"><label>TRADE DATE</label><input id="tf-date" type="date" value="${t?.trade_date ? t.trade_date.split('T')[0] : ""}"></div>
        <div class="field field-full"><label>STATUS</label>
          <div class="status-group">
            <button class="status-btn ${currentTradeStatus==="open"?"active-open":""}" onclick="setStatus('open')">🟢 Open</button>
            <button class="status-btn ${currentTradeStatus==="closed_win"?"active-win":""}" onclick="setStatus('closed_win')">✅ Win</button>
            <button class="status-btn ${currentTradeStatus==="closed_loss"?"active-loss":""}" onclick="setStatus('closed_loss')">❌ Loss</button>
          </div>
        </div>
        <div class="field field-full" id="roi-wrap" style="${currentTradeStatus!=="open"?"":"display:none"}">
          <label>ROI %</label><input id="tf-roi" value="${t?.roi || ""}" placeholder="110">
        </div>
        <div class="field field-full"><label>TRADE TITLE</label><input id="tf-title" value="${t?.title || ""}" placeholder="Describe the setup..."></div>
        <div class="field field-full">
          <label>CHART IMAGES (max 2)</label>
          <div class="img-row">
            <div>
              <img id="tf-img-preview" class="img-preview" src="${t?.chart_image || ""}" style="${t?.chart_image?"display:block":""}">
              <input type="file" accept="image/*" onchange="previewImg(this,'tf-img-preview')" style="font-size:11px;color:var(--dim);width:100%">
              <span style="font-size:10px;color:var(--muted)">Image 1 (main)</span>
            </div>
            <div>
              <img id="tf-img2-preview" class="img-preview" src="${t?.chart_image_2 || ""}" style="${t?.chart_image_2?"display:block":""}">
              <input type="file" accept="image/*" onchange="previewImg(this,'tf-img2-preview')" style="font-size:11px;color:var(--dim);width:100%">
              <span style="font-size:10px;color:var(--muted)">Image 2 (swipe)</span>
            </div>
          </div>
        </div>
        <div class="field field-full"><label>CAPTION</label><textarea id="tf-caption" placeholder="Describe the trade setup...">${t?.caption || ""}</textarea></div>
        <div class="field field-full"><label>X POST LINK</label><input id="tf-xpost" value="${t?.x_post || ""}" placeholder="https://x.com/i/status/..."></div>
      </div>

      <div id="update-posts-wrap"></div>
      <button class="btn-add-update" onclick="addUpdatePost()">+ Add Update</button>

      <div class="form-btns">
        <button class="btn-save" id="btn-save-trade" onclick="saveTrade()"><span class="spinner"></span>Save Trade</button>
        <button class="btn-cancel" onclick="closeTradeForm()">Cancel</button>
      </div>
      <p class="save-feedback" id="trade-feedback">✓ Saved successfully</p>
    </div>
  `;
  if (t?.chart_image) document.getElementById("tf-img-preview").dataset.existing = t.chart_image;
  if (t?.chart_image_2) document.getElementById("tf-img2-preview").dataset.existing = t.chart_image_2;
  renderUpdatePosts();
}

function setStatus(status) {
  currentTradeStatus = status;
  document.querySelectorAll(".status-btn").forEach(b => b.className = "status-btn");
  event.target.className = `status-btn active-${status === "open" ? "open" : status === "closed_win" ? "win" : "loss"}`;
  document.getElementById("roi-wrap").style.display = status !== "open" ? "" : "none";
}

function addUpdatePost() {
  tradePostForms.push({ id: null, label: `Update ${tradePostForms.length + 1}`, caption: "", x_post: "", existingImg: null, existingImg2: null });
  renderUpdatePosts();
}
function removeUpdatePost(i) {
  tradePostForms.splice(i, 1);
  renderUpdatePosts();
}

function renderUpdatePosts() {
  document.getElementById("update-posts-wrap").innerHTML = tradePostForms.map((p, i) => `
    <div class="post-form">
      <div class="post-form-header">
        <span class="post-form-label">UPDATE ${i + 1}</span>
        <button class="btn-remove-post" onclick="removeUpdatePost(${i})">✕ Remove</button>
      </div>
      <div class="field" style="margin-bottom:10px"><label>LABEL</label><input id="up-label-${i}" value="${p.label}" placeholder="Update 1"></div>
      <div class="field" style="margin-bottom:10px">
        <label>IMAGES (max 2)</label>
        <div class="img-row">
          <div>
            <img id="up-img-preview-${i}" class="img-preview" src="${p.existingImg || ""}" style="${p.existingImg?"display:block":""}">
            <input type="file" accept="image/*" onchange="previewImg(this,'up-img-preview-${i}')" style="font-size:11px;color:var(--dim);width:100%">
          </div>
          <div>
            <img id="up-img2-preview-${i}" class="img-preview" src="${p.existingImg2 || ""}" style="${p.existingImg2?"display:block":""}">
            <input type="file" accept="image/*" onchange="previewImg(this,'up-img2-preview-${i}')" style="font-size:11px;color:var(--dim);width:100%">
          </div>
        </div>
      </div>
      <div class="field" style="margin-bottom:10px"><label>CAPTION</label><textarea id="up-caption-${i}" placeholder="What happened...">${p.caption || ""}</textarea></div>
      <div class="field"><label>X POST LINK</label><input id="up-xpost-${i}" value="${p.x_post || ""}" placeholder="https://x.com/i/status/..."></div>
    </div>
  `).join("");
}

function closeTradeForm() {
  document.getElementById("trade-form-wrap").innerHTML = "";
  editingTradeId = null;
  tradePostForms = [];
}

async function saveTrade() {
  const btn = document.getElementById("btn-save-trade");
  const feedback = document.getElementById("trade-feedback");
  btn.classList.add("loading");
  feedback.style.display = "none";

  // Original images
  let chartImage = document.getElementById("tf-img-preview")?.dataset.existing || null;
  let chartImage2 = document.getElementById("tf-img2-preview")?.dataset.existing || null;

  const fileInputs = document.querySelectorAll('#trade-form-wrap > .form-box > .form-grid input[type="file"]');
  // First two are original images
  if (fileInputs[0]?.files[0]) {
    try { chartImage = await uploadImage(fileInputs[0].files[0], "charts"); } catch(e) { alert(e.message); btn.classList.remove("loading"); return; }
  }
  if (fileInputs[1]?.files[0]) {
    try { chartImage2 = await uploadImage(fileInputs[1].files[0], "charts"); } catch(e) { alert(e.message); btn.classList.remove("loading"); return; }
  }

  const tradePayload = {
    ticker: document.getElementById("tf-ticker").value,
    timeframe: document.getElementById("tf-tf").value,
    exchange: document.getElementById("tf-ex").value,
    trade_type: document.getElementById("tf-type").value,
    status: currentTradeStatus,
    roi: document.getElementById("tf-roi")?.value || null,
    title: document.getElementById("tf-title").value,
    chart_image: chartImage,
    chart_image_2: chartImage2,
    caption: document.getElementById("tf-caption").value,
    x_post: document.getElementById("tf-xpost").value,
    trade_date: document.getElementById("tf-date").value || null,
    updated_at: new Date().toISOString(),
  };

  try {
    let tradeId = editingTradeId;
    if (editingTradeId) {
      await sb.from("trades").update(tradePayload).eq("id", editingTradeId);
      await sb.from("trade_updates").delete().eq("trade_id", editingTradeId);
    } else {
      const maxPos = trades.reduce((m, t) => Math.max(m, t.position || 0), 0);
      tradePayload.position = maxPos + 1;
      const { data } = await sb.from("trades").insert(tradePayload).select();
      tradeId = data[0].id;
    }

    // Updates – each has 2 potential images
    for (let i = 0; i < tradePostForms.length; i++) {
      const upFile1 = document.querySelector(`#up-img-preview-${i}`)?.closest('div')?.querySelector('input[type="file"]');
      const upFile2 = document.querySelector(`#up-img2-preview-${i}`)?.closest('div')?.querySelector('input[type="file"]');

      let upImg = tradePostForms[i].existingImg;
      let upImg2 = tradePostForms[i].existingImg2;

      if (upFile1?.files[0]) {
        try { upImg = await uploadImage(upFile1.files[0], "charts"); } catch(e) {}
      }
      if (upFile2?.files[0]) {
        try { upImg2 = await uploadImage(upFile2.files[0], "charts"); } catch(e) {}
      }

      await sb.from("trade_updates").insert({
        trade_id: tradeId,
        label: document.getElementById(`up-label-${i}`)?.value || `Update ${i+1}`,
        chart_image: upImg,
        chart_image_2: upImg2,
        caption: document.getElementById(`up-caption-${i}`)?.value || "",
        x_post: document.getElementById(`up-xpost-${i}`)?.value || "",
      });
    }

    feedback.style.display = "block";
    flash();
    setTimeout(() => { closeTradeForm(); loadTrades(); }, 800);
  } catch(e) {
    alert("Save failed: " + e.message);
  }
  btn.classList.remove("loading");
}

async function deleteTrade(id) {
  if (!confirm("Delete this trade and all updates?")) return;
  await sb.from("trade_updates").delete().eq("trade_id", id);
  await sb.from("trades").delete().eq("id", id);
  await loadTrades();
}

function renderTradeList() {
  const list = document.getElementById("trade-list");
  if (!trades.length) { list.innerHTML = '<p class="empty-msg">No trades yet.</p>'; return; }
  list.innerHTML = trades.map(t => `
    <div class="item-row">
      ${t.chart_image ? `<img class="item-thumb" src="${t.chart_image}" alt="">` : `<div class="item-thumb"></div>`}
      <div class="item-info">
        <p class="item-title">${t.ticker}/USDT · ${t.title || ""}</p>
        <p class="item-meta">${t.status === "open" ? "🟢 Open" : t.status === "closed_win" ? "✅ Win" : "❌ Loss"} · ${(t.trade_updates || []).length} updates · ${formatDate(t.trade_date || t.created_at)}</p>
      </div>
      <div class="item-actions">
        <button class="btn-order" onclick="moveTrade('${t.id}',-1)">↑</button>
        <button class="btn-order" onclick="moveTrade('${t.id}',1)">↓</button>
        <button class="btn-edit" onclick="openTradeForm('${t.id}')">Edit</button>
        <button class="btn-del" onclick="deleteTrade('${t.id}')">Del</button>
      </div>
    </div>
  `).join("");
}

function moveTrade(id, dir) {
  const idx = trades.findIndex(t => t.id === id);
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= trades.length) return;
  [trades[idx], trades[swapIdx]] = [trades[swapIdx], trades[idx]];
  renderTradeList();
  tradesOrderDirty = true;
  document.getElementById("save-order-trades").style.display = "inline-block";
}

async function saveTradeOrder() {
  const btn = document.getElementById("save-order-trades");
  btn.textContent = "Saving...";
  btn.disabled = true;
  for (let i = 0; i < trades.length; i++) {
    await sb.from("trades").update({ position: i + 1 }).eq("id", trades[i].id);
  }
  tradesOrderDirty = false;
  btn.textContent = "Save Order";
  btn.style.display = "none";
  btn.disabled = false;
  flash();
}

// ─── REVIEWS ──────────────────────────────────────────────────────────────────
function renderReviewList() {
  const list = document.getElementById("review-list");
  if (!reviews.length) { list.innerHTML = '<p class="empty-msg">No reviews yet.</p>'; return; }
  list.innerHTML = reviews.map(r => `
    <div class="review-card">
      <p class="review-name">${r.name || "Anonymous"}</p>
      <p class="review-date">${formatDate(r.created_at)}</p>
      <p class="review-text">${r.review}</p>
    </div>
  `).join("");
}

function formatDate(str) {
  if (!str) return "";
  return new Date(str).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}

(async () => {
  await checkAuth();
  await Promise.all([loadArticles(), loadTrades(), loadReviews()]);
})();
</script>
</body>
</html>
